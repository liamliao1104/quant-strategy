name: ETF 动量轮动每日分析

on:
  schedule:
    # 14:10 北京时间 = 06:10 UTC，周一至周五
    - cron: '10 6 * * 1-5'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write # 允许提交报告回仓库

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行 ETF 动量分析
        run: python etf_daily_analysis.py
        env:
          CI: 'true'

      - name: 提交报告到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "ETF分析报告 $(date -u -d '+8 hours' '+%Y%m%d')"
          git push
